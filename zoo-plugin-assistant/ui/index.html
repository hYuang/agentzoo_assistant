<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Learning Assistant</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f5f2;
        --fg: #1e1d1a;
        --muted: #6d6a61;
        --line: #e4e1d9;
        --accent: #0b6a55;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111110;
          --fg: #f1f0ea;
          --muted: #a3a096;
          --line: #2e2d28;
          --accent: #35c4a0;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.55 "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        max-width: 460px;
        margin: 24px;
        padding: 28px 30px;
        border: 1px solid var(--line);
        border-radius: 14px;
        text-align: center;
      }
      h1 { margin: 0 0 10px; font-size: 20px; }
      p { margin: 0 0 18px; color: var(--muted); }
      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>My Learning Assistant</h1>
      <p>我的学习助理由宿主应用加载。请从应用首页进入。</p>
      <p><a href="/">Open the app home</a></p>
    </div>
  </body>
</html>
