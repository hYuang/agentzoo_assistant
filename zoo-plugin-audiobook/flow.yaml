# Workflow relationships for the audiobook plugin.
#
# Declares the business roles, decision gates, and how the tasks defined in
# tasks.yaml are ordered (depends_on), gated, and fanned out (foreach).

workflow:
  id: audiobook_production
  name: Audiobook production

roles:
  - id: producer
    name: Producer
    kind: human
    capabilities: []
    can_approve: [direction, brief, outline, casting, final]

  - id: researcher
    name: Researcher
    kind: agent
    capabilities: [research, kb_search, file_read]
    can_approve: []

  - id: story_architect
    name: Story Architect
    kind: agent
    capabilities: [long_form_writing, structured_output, file_write]
    can_approve: []

  - id: script_adapter
    name: Script Adapter
    kind: agent
    capabilities: [dialogue_adaptation, pronunciation, file_write]
    can_approve: []

  - id: voice_director
    name: Voice Director
    kind: agent
    capabilities: [tts, voice_catalog]
    can_approve: []

  - id: audio_engineer
    name: Audio Engineer
    kind: agent
    capabilities: [audio_mix, audio_qc, file_write]
    can_approve: []

  - id: qa
    name: Quality Assurance
    kind: agent
    capabilities: [audio_qc, script_compare]
    can_approve: []

gates:
  - id: direction
    name: Direction approval
    approver: producer
    on_reject: discover

  - id: greenlight
    name: Greenlight
    approver: producer
    on_reject: brief

  - id: outline
    name: Outline approval
    approver: producer
    on_reject: story

  - id: script
    name: Script lock
    approver: qa
    on_reject: script

  - id: casting
    name: Casting approval
    approver: producer
    on_reject: casting

  - id: final
    name: Final approval
    approver: producer
    on_reject: qc

flow:
  - id: discover
    depends_on: []
    gate: direction

  - id: brief
    depends_on: [discover]
    gate: greenlight

  - id: source
    depends_on: [brief]

  - id: story
    depends_on: [source]
    gate: outline

  - id: script
    depends_on: [story]
    gate: script

  - id: casting
    depends_on: [script]
    gate: casting

  - id: synthesis
    depends_on: [casting]
    foreach: script.chapters

  - id: post
    depends_on: [synthesis]

  - id: qc
    depends_on: [post]
    gate: final

  - id: delivery
    depends_on: [qc]
