# Task definitions for the audiobook plugin.
#
# Each task declares what it is, who executes it, which artifacts it reads
# (inputs) and writes (outputs), and where its stage prompt lives. How tasks
# are ordered and gated lives in flow.yaml.

tasks:
  - id: discover
    name: Discover
    role: story_architect
    requires: [structured_output]
    inputs: [project]
    outputs: [directions]
    prompt_file: prompts/stages/discover.md

  - id: brief
    name: Brief
    role: producer
    requires: []
    inputs: [project]
    outputs: [project]
    prompt_file: prompts/stages/brief.md

  - id: source
    name: Source preparation
    role: researcher
    requires: [research, file_read]
    inputs: [project]
    outputs: [asset_index]
    prompt_file: prompts/stages/source.md

  - id: story
    name: Story bible and outline
    role: story_architect
    requires: [long_form_writing, structured_output]
    inputs: [project, asset_index]
    outputs: [story_bible, outline]
    prompt_file: prompts/stages/story.md

  - id: script
    name: Script adaptation
    role: script_adapter
    requires: [dialogue_adaptation, pronunciation]
    inputs: [story_bible, outline, asset_index]
    outputs: [script]
    prompt_file: prompts/stages/script.md

  - id: casting
    name: Casting and voice design
    role: voice_director
    requires: [tts, voice_catalog]
    inputs: [story_bible, script]
    outputs: [casting]
    prompt_file: prompts/stages/casting.md

  - id: synthesis
    name: Synthesis
    role: voice_director
    requires: [tts]
    inputs: [script, casting]
    outputs: [audio]
    prompt_file: prompts/stages/synthesis.md

  - id: post
    name: Post-production
    role: audio_engineer
    requires: [audio_mix, audio_qc]
    inputs: [audio, script, casting, asset_index]
    outputs: [audio]
    prompt_file: prompts/stages/post.md

  - id: qc
    name: Quality control
    role: qa
    requires: [audio_qc, script_compare]
    inputs: [script, casting, audio]
    outputs: [qc]
    prompt_file: prompts/stages/qc.md

  - id: delivery
    name: Delivery
    role: producer
    requires: [file_write]
    inputs: [project, audio, qc, asset_index]
    outputs: [package]
    prompt_file: prompts/stages/delivery.md
