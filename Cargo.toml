[workspace]
resolver = "2"
members = [
    "server",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Framework crates are consumed from the private git repository at a pinned rev.
zoo-shared = { git = "ssh://git@github.com/hYuang/agentzoo.git", tag = "v1.2.0" }
zoo-agent = { git = "ssh://git@github.com/hYuang/agentzoo.git", tag = "v1.2.0" }
zoo-server = { git = "ssh://git@github.com/hYuang/agentzoo.git", tag = "v1.2.0", default-features = false }
zoo-store = { git = "ssh://git@github.com/hYuang/agentzoo.git", tag = "v1.2.0" }
zoo-bootstrap = { git = "ssh://git@github.com/hYuang/agentzoo.git", tag = "v1.2.0", default-features = false }

