[workspace]
resolver = "2"
members = [
    "zooagent",
    "assistant",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"

# Local development uses the sibling framework checkout at ../agentzoo.
# For CI/publishing, replace these with git dependencies pinned to a tag, e.g.
# zoo-server = { git = "git@github.com:hYuang/agentzoo.git", tag = "v1.1.0", default-features = false }
zoo-shared = { path = "../agentzoo/zoo-shared" }
zoo-agent = { path = "../agentzoo/zoo-agent" }
zoo-server = { path = "../agentzoo/zoo-server", default-features = false }
zoo-store = { path = "../agentzoo/zoo-store" }
zoo-bootstrap = { path = "../agentzoo/zoo-bootstrap", default-features = false }
zoo-assistant = { path = "assistant" }
