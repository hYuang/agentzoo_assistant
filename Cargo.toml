[workspace]
resolver = "2"
members = [
    "server",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = "0.9"
sha2 = "0.10"
rand = "0.8"

# Framework crates are consumed from the git repository at a pinned tag.
zoo-shared = { git = "https://github.com/hYuang/agentzoo.git", tag = "v1.3.0" }
zoo-agent = { git = "https://github.com/hYuang/agentzoo.git", tag = "v1.3.0" }
zoo-server = { git = "https://github.com/hYuang/agentzoo.git", tag = "v1.3.0", default-features = false }
zoo-store = { git = "https://github.com/hYuang/agentzoo.git", tag = "v1.3.0" }
zoo-bootstrap = { git = "https://github.com/hYuang/agentzoo.git", tag = "v1.3.0", default-features = false }

