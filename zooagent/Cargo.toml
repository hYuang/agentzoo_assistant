[package]
name = "zooagent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "zooagent"
path = "src/main.rs"

[features]
default = ["zvec"]
zvec = ["zoo-server/zvec"]

[dependencies]
zoo-server = { workspace = true }
zoo-plugins = { workspace = true }
zoo-plugin-assistant = { workspace = true }
tokio = { workspace = true }
