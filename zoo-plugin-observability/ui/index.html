<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Observability · 对话与日志分析</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel2: #1d212b;
    --border: #2a2f3a;
    --text: #e6e9ef;
    --muted: #8b93a7;
    --accent: #5b8cff;
    --ok: #3fb96f;
    --warn: #e0a63b;
    --err: #e05b5b;
    --user: #3b6fe0;
    --assistant: #5b8cff;
    --tool: #8b6fe0;
    --system: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 12px; }
  .tabs { display: flex; gap: 4px; margin-left: 24px; }
  .tab {
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
    color: var(--muted); border: 1px solid transparent; user-select: none;
  }
  .tab.active { background: var(--panel2); color: var(--text); border-color: var(--border); }
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
  }
  .card .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .card .value { font-size: 22px; font-weight: 600; }
  .card .value.small { font-size: 15px; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .toolbar input, .toolbar select {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 10px; font-size: 13px; outline: none;
  }
  .toolbar input { flex: 1; min-width: 180px; }
  .toolbar button {
    background: var(--accent); color: #fff; border: none;
    border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 13px;
  }
  .toolbar button.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { color: var(--muted); font-weight: 500; background: var(--panel2); position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--panel2); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; background: var(--panel2); border: 1px solid var(--border); color: var(--muted); }
  .badge.err { color: var(--err); border-color: var(--err); }
  .empty { color: var(--muted); text-align: center; padding: 40px; }
  .loading { color: var(--muted); padding: 30px; text-align: center; }
  .log-line { display: flex; gap: 10px; padding: 3px 10px; font: 12px/1.5 ui-monospace, Consolas, monospace; border-bottom: 1px solid var(--border); }
  .log-line:hover { background: var(--panel2); }
  .log-at { color: var(--muted); white-space: nowrap; }
  .log-lvl { width: 52px; flex-shrink: 0; font-weight: 600; }
  .log-lvl.INFO { color: var(--ok); }
  .log-lvl.WARN { color: var(--warn); }
  .log-lvl.ERROR { color: var(--err); }
  .log-lvl.DEBUG, .log-lvl.TRACE { color: var(--muted); }
  .log-target { color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
  .log-msg { white-space: pre-wrap; word-break: break-all; flex: 1; }
  .logbox { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; max-height: 70vh; overflow: auto; }
  .detail { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .detail h2 { margin: 0 0 10px; font-size: 15px; }
  .msg { border-left: 3px solid var(--border); padding: 8px 12px; margin: 8px 0; background: var(--panel2); border-radius: 0 8px 8px 0; }
  .msg.user { border-left-color: var(--user); }
  .msg.assistant { border-left-color: var(--assistant); }
  .msg.tool { border-left-color: var(--tool); }
  .msg.system { border-left-color: var(--system); }
  .msg .meta { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; font-size: 11px; color: var(--muted); }
  .msg .body { white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  .msg .tools { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .msg .tools code { background: var(--bg); padding: 1px 6px; border-radius: 4px; }
  .back { cursor: pointer; color: var(--accent); font-size: 13px; margin-bottom: 12px; display: inline-block; }
  .kv { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .kv b { color: var(--text); font-weight: 500; }
  .hidden { display: none; }
  .levels { display: flex; gap: 6px; flex-wrap: wrap; }
  .levels .lv { font-size: 11px; padding: 2px 8px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--border); }
</style>
</head>
<body>
<header>
  <h1>Observability</h1>
  <span class="sub" id="project-sub">对话与日志分析</span>
  <div class="tabs">
    <div class="tab active" data-tab="conversations">对话分析</div>
    <div class="tab" data-tab="agents">Agent 提示词</div>
    <div class="tab" data-tab="logs">日志</div>
  </div>
</header>
<main>
  <section id="tab-conversations">
    <div id="conv-summary"></div>
    <div class="toolbar">
      <input id="conv-filter" placeholder="按标题 / agent / 会话 id 过滤…" />
    </div>
    <div id="conv-list"></div>
  </section>
  <section id="tab-agents" class="hidden">
    <div id="agents-body"><div class="loading">加载中…</div></div>
  </section>
  <section id="tab-logs" class="hidden">
    <div class="toolbar">
      <select id="log-level">
        <option value="">全部级别</option>
        <option value="TRACE">TRACE</option>
        <option value="DEBUG">DEBUG</option>
        <option value="INFO">INFO</option>
        <option value="WARN">WARN</option>
        <option value="ERROR">ERROR</option>
      </select>
      <input id="log-q" placeholder="搜索日志内容（关键字）…" />
      <button id="log-reload">刷新</button>
      <button class="ghost" id="log-more">加载更多</button>
      <span class="levels" id="log-levels"></span>
    </div>
    <div class="logbox" id="log-box"><div class="loading">加载中…</div></div>
  </section>
  <section id="tab-detail" class="hidden">
    <span class="back" id="back-to-list">← 返回对话列表</span>
    <div id="detail-body"></div>
  </section>
</main>
<script>
const params = new URLSearchParams(location.search);
const PROJECT = params.get('project') || '';
const API = '/projects/' + encodeURIComponent(PROJECT) + '/plugins/observability/analysis';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n) => (n ?? 0).toLocaleString();
const time = (s) => s ? s.replace('T', ' ').replace(/\.\d+Z$/, ' UTC') : '—';

async function get(url, params) {
  if (params) {
    const qs = Object.entries(params)
      .filter(([, v]) => v !== undefined && v !== null && v !== '')
      .map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v))
      .join('&');
    if (qs) url += (url.includes('?') ? '&' : '?') + qs;
  }
  const res = await fetch(url);
  const json = await res.json();
  if (json.code !== 'ok') throw new Error(json.message || json.code);
  return json.data;
}

let conversations = [];
let logLines = [];
let logOffset = 0;
const LOG_PAGE = 400;
let agentsData = null;
let agentsLoaded = false;

function setTab(name) {
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === name));
  $('tab-conversations').classList.toggle('hidden', name !== 'conversations');
  $('tab-agents').classList.toggle('hidden', name !== 'agents');
  $('tab-logs').classList.toggle('hidden', name !== 'logs');
  $('tab-detail').classList.toggle('hidden', name !== 'detail');
  if (name === 'agents' && !agentsLoaded) loadAgents();
}
document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => setTab(t.dataset.tab)));

function renderSummary(d) {
  $('conv-summary').innerHTML =
    '<div class="cards">' +
    card('对话数', d.conversation_count) +
    card('消息总数', fmt(d.conversations.reduce((a, c) => a + c.message_count, 0))) +
    card('Prompt tokens', fmt(d.prompt_tokens)) +
    card('Completion tokens', fmt(d.completion_tokens)) +
    card('助手轮次', fmt(d.turns)) +
    card('错误信号', fmt(d.errors), d.errors > 0 ? 'var(--err)' : null) +
    '</div>';
}
function card(label, value, color) {
  return '<div class="card"><div class="label">' + esc(label) + '</div><div class="value"' +
    (color ? ' style="color:' + color + '"' : '') + '>' + value + '</div></div>';
}

function renderConvList() {
  const q = $('conv-filter').value.trim().toLowerCase();
  const rows = conversations.filter((c) =>
    !q || c.title.toLowerCase().includes(q) ||
    c.sessions.some((s) => s.agent.toLowerCase().includes(q) || s.session_id.includes(q))
  );
  if (!rows.length) { $('conv-list').innerHTML = '<div class="empty">没有匹配的对话</div>'; return; }
  let html = '<table><thead><tr>' +
    '<th>标题</th><th>会话</th><th>消息</th><th class="num">Tokens (P/C)</th><th class="num">轮次</th><th class="num">错误</th><th>最近活动</th>' +
    '</tr></thead><tbody>';
  for (const c of rows) {
    html += '<tr data-cid="' + esc(c.conversation_id) + '">' +
      '<td>' + esc(c.title || '(未命名)') + '</td>' +
      '<td>' + c.session_count + '</td>' +
      '<td>' + fmt(c.message_count) + '</td>' +
      '<td class="num">' + fmt(c.prompt_tokens) + ' / ' + fmt(c.completion_tokens) + '</td>' +
      '<td class="num">' + fmt(c.turns) + '</td>' +
      '<td class="num">' + (c.errors ? '<span class="badge err">' + c.errors + '</span>' : '0') + '</td>' +
      '<td>' + time(c.last_at) + '</td>' +
      '</tr>';
  }
  html += '</tbody></table>';
  $('conv-list').innerHTML = html;
  $('conv-list').querySelectorAll('tr[data-cid]').forEach((tr) =>
    tr.addEventListener('click', () => openDetail(tr.dataset.cid)));
}
$('conv-filter').addEventListener('input', renderConvList);

async function loadConversations() {
  try {
    const d = await get(API + '/conversations');
    conversations = d.conversations;
    renderSummary(d);
    renderConvList();
  } catch (e) {
    $('conv-list').innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
  }
}

async function openDetail(cid) {
  setTab('detail');
  $('detail-body').innerHTML = '<div class="loading">加载中…</div>';
  try {
    const d = await get(API + '/conversations/' + encodeURIComponent(cid));
    renderDetail(d);
  } catch (e) {
    $('detail-body').innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
  }
}
$('back-to-list').addEventListener('click', () => setTab('conversations'));

async function renderDetail(d) {
  let html = '<div class="detail"><h2>' + esc(d.title || '(未命名)') + '</h2><div class="kv">' +
    '<span>会话数 <b>' + d.sessions.length + '</b></span>' +
    '<span>消息数 <b>' + fmt(d.message_count) + '</b></span>' +
    '<span>创建 <b>' + time(d.created_at) + '</b></span>' +
    '<span>更新 <b>' + time(d.updated_at) + '</b></span>' +
    '</div></div>';
  for (const s of d.sessions) {
    try {
      const st = await get(API + '/sessions/' + encodeURIComponent(s.session_id));
      const toolDist = (st.tool_distribution || []).map((t) =>
        '<span class="badge">' + esc(t.name) + ' ×' + t.count + '</span>'
      ).join(' ');
      html += '<div class="detail" style="margin-bottom:8px">' +
        '<h3 style="font-size:13px;margin:0 0 8px">' + esc(s.agent) +
        (s.is_main ? ' <span class="badge">主</span>' : '') +
        '</h3>' +
        '<div class="kv">' +
        '<span>LLM 调用 <b>' + fmt(st.llm_calls) + '</b></span>' +
        '<span>工具调用 <b>' + fmt(st.tool_calls) + '</b></span>' +
        '<span>Tokens <b>' + fmt(st.prompt_tokens) + '→' + fmt(st.completion_tokens) + '</b></span>' +
        '<span>错误 <b>' + (st.errors ? '<span style="color:var(--err)">' + st.errors + '</span>' : '0') + '</b></span>' +
        '<span>上下文 <b>' + fmt(st.context_tokens) + '</b></span>' +
        '</div>' +
        (toolDist ? '<div style="margin-top:6px">' + toolDist + '</div>' : '') +
        '</div>';
    } catch (e) { /* skip session stats on error */ }
  }
  for (const m of d.messages) {
    const texts = (m.content || [])
      .filter((b) => b.kind === 'text' || b.kind === 'reasoning')
      .map((b) => b.text)
      .join('\n');
    const tools = (m.tool_calls || []).map((t) =>
      '<div>🔧 <code>' + esc(t.name) + '</code> ' + esc(JSON.stringify(t.arguments).slice(0, 200)) + '</div>').join('');
    html += '<div class="msg ' + esc(m.role) + '">' +
      '<div class="meta"><span class="badge">' + esc(m.agent) + '</span>' +
      '<span class="badge">' + esc(m.role) + '</span>' +
      '<span>' + time(m.at) + '</span>' +
      (m.usage ? '<span>' + fmt(m.usage.prompt_tokens) + '→' + fmt(m.usage.completion_tokens) + ' tokens</span>' : '') +
      '</div>' +
      (texts ? '<div class="body">' + esc(texts) + '</div>' : '') +
      (tools ? '<div class="tools">' + tools + '</div>' : '') +
      '</div>';
  }
  $('detail-body').innerHTML = html;
}

async function loadAgents() {
  try {
    const d = await get('/projects/' + encodeURIComponent(PROJECT) + '/plugins/observability/agents');
    agentsData = d;
    agentsLoaded = true;
    renderAgents();
  } catch (e) {
    $('agents-body').innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
  }
}

function renderAgents() {
  if (!agentsData) return;
  let html = '<div class="cards">' +
    card('Agent 数', agentsData.agent_count) +
    '</div>';
  for (const a of agentsData.agents) {
    const layerRows = (a.prompt_layers || []).map((l) =>
      '<tr><td>' + esc(l.name) + '</td><td class="num">' + fmt(l.chars) + '</td><td style="max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(l.content.slice(0, 120)) + '…</td></tr>'
    ).join('');
    const toolRows = (a.tools || []).map((t) =>
      '<tr><td><code>' + esc(t.name) + '</code></td><td>' + esc(t.description.slice(0, 100)) + '</td></tr>'
    ).join('');
    html += '<div class="detail">' +
      '<h2>' + esc(a.name) + ' <span class="badge">budget ' + fmt(a.context_budget) + '</span></h2>' +
      '<h3 style="font-size:13px;color:var(--muted);margin:12px 0 6px">提示词分层（共 ' + (a.prompt_layers||[]).length + ' 层）</h3>' +
      '<table><thead><tr><th>层</th><th class="num">字符数</th><th>内容预览</th></tr></thead><tbody>' + layerRows + '</tbody></table>' +
      '<h3 style="font-size:13px;color:var(--muted);margin:12px 0 6px">工具（' + (a.tools||[]).length + ' 个）</h3>' +
      '<table><thead><tr><th>名称</th><th>描述</th></tr></thead><tbody>' + toolRows + '</tbody></table>' +
      '</div>';
  }
  $('agents-body').innerHTML = html;
}

async function loadLogs(reset) {
  if (reset) { logLines = []; logOffset = 0; }
  const level = $('log-level').value;
  const q = $('log-q').value.trim();
  try {
    const d = await get(API + '/logs', { limit: LOG_PAGE, level, q });
    if (!d.available) {
      $('log-box').innerHTML = '<div class="empty">未找到日志文件：' + esc(d.path) + '</div>';
      return;
    }
    if (reset) logLines = d.lines; else logLines = logLines.concat(d.lines);
    logOffset = logLines.length;
    renderLogs(d);
  } catch (e) {
    $('log-box').innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>';
  }
}
function renderLogs(d) {
  const levels = Object.entries(d.levels || {}).map(([k, v]) =>
    '<span class="lv">' + esc(k) + ' ' + fmt(v) + '</span>').join('');
  $('log-levels').innerHTML = levels + '<span class="lv">共 ' + fmt(d.total_lines) + ' 行</span>';
  if (!logLines.length) { $('log-box').innerHTML = '<div class="empty">没有匹配的日志</div>'; return; }
  $('log-box').innerHTML = logLines.map((l) =>
    '<div class="log-line"><span class="log-at">' + esc(l.at || '') + '</span>' +
    '<span class="log-lvl ' + esc(l.level) + '">' + esc(l.level) + '</span>' +
    '<span class="log-target">' + esc(l.target || '') + '</span>' +
    '<span class="log-msg">' + esc(l.message) + '</span></div>').join('');
}
$('log-reload').addEventListener('click', () => loadLogs(true));
$('log-more').addEventListener('click', () => loadLogs(false));
$('log-q').addEventListener('keydown', (e) => { if (e.key === 'Enter') loadLogs(true); });
$('log-level').addEventListener('change', () => loadLogs(true));

if (!PROJECT) {
  document.querySelector('main').innerHTML =
    '<div class="empty">缺少 project 参数。请通过 <code>?project=&lt;id&gt;</code> 打开本页，或在应用内进入。</div>';
} else {
  $('project-sub').textContent = '项目 ' + PROJECT + ' · 对话与日志分析';
  loadConversations();
}
</script>
</body>
</html>
